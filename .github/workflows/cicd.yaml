name: cicd

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # Fix: Inject this step to activate JDK 21 before compiling
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin' # Best open-source JDK distribution
          cache: 'maven'          # Optimizes build speed by caching dependencies

      - name: build
        run: mvn clean package
      
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-app-jar
          path: target/*.jar # Grabs whatever jar was created inside the target folder
