name: cicd

on:
  push:
    branches:
      - main

jobs:
  # ==========================================
  # JOB 1: Continuous Integration (Compile)
  # ==========================================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # Activating JDK 21 context
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: build
        run: mvn clean package
      
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-app-jar
          path: target/*.jar

  # ==========================================
  # JOB 2: Build & Push Docker Image via Buildx
  # ==========================================
  docker_build:
    runs-on: ubuntu-latest
    needs: build # Runs only if compilation is successful

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Set up QEMU for multi-platform support if needed later
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx (Essential for multi-stage caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log into your Docker Hub account securely
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      # Build the multi-stage Dockerfile and push it
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Replace 'your-dockerhub-username' with your actual username
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/springboot-app:${{github.run_id}}
          # Smart Caching: This caches intermediate stages so rebuilds take seconds!
          cache-from: type=gha
          cache-to: type=gha,mode=max
