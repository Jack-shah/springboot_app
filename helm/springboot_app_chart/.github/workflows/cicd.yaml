name: cicd # Added 'name:' key here so GitHub knows the workflow name

on:
  push:
    branches:
      - main # Fixed: Added a dash (-) and proper indentation here

jobs: # Fixed: You MUST declare the 'jobs:' block before listing your jobs
  build: # Fixed: Added a colon (:) after the job name
    runs-on: ubuntu-latest # Fixed: Added proper indentation under the job name
    steps:
      - name: checkout
        uses: actions/checkout@v4 # Recommendation: Upgraded to v4 (v3 is deprecated)

      - name: build
        run: mvn clean package
